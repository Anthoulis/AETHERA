<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact | AETHERA</title>
  <link rel="stylesheet" href="assets/css/style.css"/>
</head>
<body class="page-contact">
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="brand" aria-label="AETHERA - Greek Premium Products (home)">
        <img src="assets/icons/logo.svg" alt="AETHERA Logo" class="logo">
        <div class="brand-text">
          <svg class="brand-est gold-text" width="120" height="20" viewBox="0 0 120 20" aria-hidden="true" focusable="false"><defs><path id="est-curve" d="M10,18 A50,50 0 0 1 110,18"/></defs><text style="font-size:11px; font-style:italic; letter-spacing:2px;" text-anchor="middle"><textPath href="#est-curve" startOffset="50%" style="fill: currentColor">A� est 1934 A�</textPath></text></svg>
          <div class="brand-name gold-text">AETHERA</div>
          <div class="brand-tag gold-text" data-i18n="brand-tag">GREEK PREMIUM PRODUCTS</div>
        </div>
      </a>
      <div class="header-actions">
        <nav class="main-nav">
          <a href="index.html" data-i18n="nav-home">Home</a>
          <a href="about.html" data-i18n="nav-about">About</a>
          <a href="products.html" data-i18n="nav-products">Products</a>
          <a href="contact.html" data-i18n="nav-contact">Contact</a>
        </nav>
        <div class="lang-dropdown">
          <button class="lang-toggle" aria-haspopup="listbox" aria-expanded="false">
            <span class="lang-flag" aria-hidden="true">EN</span>
            <span class="lang-label">English</span>
          </button>
          <div class="lang-menu" role="listbox">
            <button role="option" data-lang="en" data-flag="EN"><span class="lang-flag">EN</span> English</button>
            <button role="option" data-lang="de" data-flag="DE"><span class="lang-flag">DE</span> Deutsch</button>
            <button role="option" data-lang="el" data-flag="EL"><span class="lang-flag">EL</span> Ελληνικά</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <section class="section">
    <div class="container">
      <h1 data-i18n="contact-title">Contact</h1>
      <p class="lead" data-i18n="contact-lead">Questions or collaborations — send us a note.</p>

      <!-- Simple, provider-agnostic form; replace action with Formspree/EmailJS endpoint -->
      <form class="products" style="gap:1rem; grid-template-columns:1fr;" method="post" action="#">
        <div>
          <label for="name" data-i18n="contact-name-label">Name</label>
          <input id="name" name="name" class="input" required/>
        </div>
        <div>
          <label for="email" data-i18n="contact-email-label">Email</label>
          <input id="email" name="email" type="email" class="input" required/>
        </div>
        <div>
          <label for="message" data-i18n="contact-message-label">Message</label>
          <textarea id="message" name="message" rows="6" class="input" required></textarea>
        </div>
        <div>
          <button class="btn" type="submit" data-i18n="contact-submit">Send</button>
        </div>
      </form>

      <p style="margin-top:1rem" data-i18n="contact-email-alt">Prefer email? <a href="mailto:hello@aethera.gr">hello@aethera.gr</a></p>
    </div>
  </section>

  <footer class="site-footer">
    <div class="container">
      <p data-i18n="footer-copy">&copy; 2025 AETHERA. All rights reserved.</p>
      <nav class="footer-nav">
        <a href="legal/privacy.html" data-i18n="footer-privacy">Privacy Policy</a>
        <a href="legal/terms.html" data-i18n="footer-terms">Terms &amp; Conditions</a>
      </nav>
    </div>
  </footer>
  <script src="assets/js/lang.js"></script>
</body>
</html>
