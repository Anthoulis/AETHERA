<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-label="Realistic honey with drops">
  <defs>
    <linearGradient id="honeyBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff4c9"/>
      <stop offset="24%" stop-color="#f6d778"/>
      <stop offset="56%" stop-color="#e9b735"/>
      <stop offset="100%" stop-color="#c98c17"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".65"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity=".15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#fff7da" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#fff7da" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffefb8"/>
      <stop offset="40%" stop-color="#f5c654"/>
      <stop offset="100%" stop-color="#d4941d"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="none"/>
  <ellipse cx="480" cy="220" rx="280" ry="120" fill="url(#glow)"/>

  <!-- Honey jar silhouette with realistic fill -->
  <g transform="translate(480 330)">
    <g transform="translate(-130,-150)">
      <!-- jar body -->
      <rect x="30" y="60" width="260" height="210" rx="24" fill="url(#honeyBody)"/>
      <!-- jar rim -->
      <rect x="20" y="40" width="280" height="40" rx="14" fill="#e1d7be"/>
      <rect x="26" y="46" width="268" height="28" rx="10" fill="#f4efe3"/>
      <!-- glass sheen -->
      <path d="M58 76 h60 v170 c0 22 -10 30 -18 30 h-42 z" fill="url(#glass)"/>
      <path d="M108 66 c26 -10 64 -10 120 0" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="4"/>
      <!-- meniscus -->
      <path d="M48 120 c68 18 110 18 224 0" fill="none" stroke="#b87813" stroke-opacity=".35" stroke-width="6"/>
    </g>
  </g>

  <!-- Honey drops -->
  <g transform="translate(480 330)">
    <g transform="translate(180,-60)">
      <path d="M0 -30 C18 -20 26 -4 22 12 C18 28 8 38 0 46 C-8 38 -18 28 -22 12 C-26 -4 -18 -20 0 -30 z" fill="url(#drop)"/>
      <ellipse cx="-4" cy="-12" rx="6" ry="3" fill="#fff" fill-opacity=".45"/>
    </g>
    <g transform="translate(230,10) scale(0.8)">
      <path d="M0 -30 C18 -20 26 -4 22 12 C18 28 8 38 0 46 C-8 38 -18 28 -22 12 C-26 -4 -18 -20 0 -30 z" fill="url(#drop)"/>
      <ellipse cx="-4" cy="-12" rx="6" ry="3" fill="#fff" fill-opacity=".45"/>
    </g>
  </g>
</svg>
