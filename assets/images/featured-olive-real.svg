<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-label="Realistic olive branch with olives">
  <defs>
    <linearGradient id="gold" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f0d98a"/>
      <stop offset="40%" stop-color="#e0c062"/>
      <stop offset="72%" stop-color="#cfa72b"/>
      <stop offset="100%" stop-color="#a4771a"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f4f37"/>
      <stop offset="100%" stop-color="#7ba06b"/>
    </linearGradient>
    <radialGradient id="olive" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff7e6" stop-opacity=".25"/>
      <stop offset="50%" stop-color="#8a9a4a"/>
      <stop offset="100%" stop-color="#5a6b2b"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="38%" r="46%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="none"/>
  <ellipse cx="480" cy="230" rx="280" ry="120" fill="url(#halo)"/>

  <!-- branch -->
  <g transform="translate(480 340)">
    <path d="M-260 -10 C-110 -70, 110 -70, 260 -10" fill="none" stroke="#3b2d1a" stroke-opacity=".12" stroke-width="16" filter="url(#soft)"/>
    <path d="M-260 -10 C-110 -70, 110 -70, 260 -10" fill="none" stroke="url(#gold)" stroke-width="6"/>

    <!-- leaves left -->
    <g fill="none" stroke="url(#leaf)" stroke-width="6" stroke-linecap="round">
      <path d="M-200 -36 C-230 -70, -210 -86, -182 -52"/>
      <path d="M-150 -46 C-182 -76, -162 -92, -138 -60"/>
      <path d="M-98 -56 C-134 -86, -114 -102, -90 -70"/>
      <path d="M-48 -60 C-84 -92, -66 -110, -44 -80"/>
    </g>

    <!-- leaves right -->
    <g fill="none" stroke="url(#leaf)" stroke-width="6" stroke-linecap="round">
      <path d="M200 -36 C230 -70, 210 -86, 182 -52"/>
      <path d="M150 -46 C182 -76, 162 -92, 138 -60"/>
      <path d="M98 -56 C134 -86, 114 -102, 90 -70"/>
      <path d="M48 -60 C84 -92, 66 -110, 44 -80"/>
    </g>

    <!-- olives (extra virgin olives) -->
    <g>
      <ellipse cx="-140" cy="-40" rx="20" ry="26" fill="url(#olive)"/>
      <ellipse cx="-80" cy="-50" rx="18" ry="24" fill="url(#olive)"/>
      <ellipse cx="80" cy="-50" rx="18" ry="24" fill="url(#olive)"/>
      <ellipse cx="140" cy="-40" rx="20" ry="26" fill="url(#olive)"/>
    </g>
  </g>
</svg>
